# MariaDB para desarrollo. El esquema NO se crea aquí: se aplica con
#   npm run db:install   (que ejecuta db/install.sh)
services:
  mariadb:
    image: mariadb:11
    container_name: retiro_seguro_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-retiro_seguro}
      MARIADB_USER: ${DB_USER:-retiro_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-retiro_app}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
